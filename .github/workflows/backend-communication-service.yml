# GitHub Actions workflow for backend/communication-service
name: Communication Service CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/communication-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install || echo "No package.json, skipping"
      - name: Lint (optional)
        run: npm run lint || echo "No lint script, skipping"
      - name: Test (optional)
        run: npm test || echo "No test script, skipping"
      - name: Build (optional)
        run: npm run build || echo "No build script, skipping"
